<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Produtos</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="container">
        <!-- ÁREA DO SWITCH DE PARCERIA E BOTÃO DE NOVA VENDA -->
        <div class="header-acoes">
            <div class="header-parceria">
                <span class="parceria-label">Parceria:</span>
                <label class="switch">
                    <input type="checkbox" id="chkParceria" onchange="atualizarTela()">
                    <span class="slider round"></span>
                </label>
                <span id="statusParceria" class="status-texto">Desativado</span>
            </div>

            <button class="btn-reset" onclick="resetarSistema()"> Nova Venda</button>
        </div>

        <!-- LISTA DE PRODUTOS DISPONÍVEIS -->
        <div class="lista-produtos" id="listaProdutos">
            <!-- Os produtos são inseridos aqui via JavaScript -->
        </div>

        <!-- PAINEL DO CARRINHO / RESUMO -->
        <div class="painel-carrinho">
            <table class="tabela-carrinho">
                <thead>
                    <tr>
                        <th>Qtd</th>
                        <th>Produto</th>
                        <th>Valor und.</th>
                        <th>Sub Total</th>
                    </tr>
                </thead>
                <tbody id="corpoTabelaCarrinho">
                    <!-- Itens adicionados aparecerão aqui -->
                </tbody>
            </table>

            <!-- PAINEL DE TOTAIS -->
            <div class="resumo-valores">
                <div class="card-total">
                    TOTAL = R$ <span id="valorTotal">0</span>
                </div>

                <!-- TABELA DO VALOR DO PAINEL (40%) -->
                <div class="card-painel">
                    <span class="label-painel">VALOR PARA DEPOSITAR NO PAINEL (40%)</span>
                    <span class="valor-painel">R$ <span id="valorPainel">0</span></span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
